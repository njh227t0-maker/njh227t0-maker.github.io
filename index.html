<title>Raycast Random Maze</title>
<style>
html,body{margin:0;height:100%;background:#090909;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center}
#top{height:52px;display:flex;align-items:center;gap:16px;font-size:14px;flex-wrap:wrap;justify-content:center}
canvas{display:block;width:min(96vw,1100px);height:auto;image-rendering:pixelated;background:#111}
kbd{background:#292929;border:1px solid #666;border-radius:4px;padding:2px 6px}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);font-size:30px;font-weight:bold}
</style>
</head>
<body>
<div id="top">
<b>RAYCAST RANDOM MAZE</b>
<span>↑/↓ Move</span>
<span>←/→ Look</span>
<span>Alt+←/→ Strafe</span>
<span><kbd>R</kbd> New Maze</span>
</div>
<canvas id="game" width="640" height="360"></canvas>
<div id="msg">EXIT REACHED — press R for a new maze</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const COLS=15,ROWS=15;
let map,player,exitCell,won=false,showMinimap=false,enemies=[],dead=false,shootFlash=0,gunRecoil=0;

function makeMaze(){
  won=false;
  document.getElementById("msg").style.display="none";
  map=Array.from({length:ROWS},()=>Array(COLS).fill(1));
  const stack=[[1,1]];
  map[1][1]=0;
  const dirs=[[2,0],[-2,0],[0,2],[0,-2]];

  while(stack.length){
    const [x,y]=stack[stack.length-1];
    let choices=[];
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&map[ny][nx]===1)
        choices.push([nx,ny,dx,dy]);
    }
    if(!choices.length){stack.pop();continue;}
    const [nx,ny,dx,dy]=choices[Math.floor(Math.random()*choices.length)];
    map[y+dy/2][x+dx/2]=0;
    map[ny][nx]=0;
    stack.push([nx,ny]);
  }

  // Choose the open cell with the greatest Manhattan distance.
  let ex=1,ey=1,best=-1;
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(map[y][x]===0){
      const d=Math.abs(x-1)+Math.abs(y-1);
      if(d>best){best=d;ex=x;ey=y;}
    }
  }
  exitCell={x:ex,y:ey};
  player={x:1.5,y:1.5,angle:0};
  dead=false;
  shootFlash=0;

  // Spawn about five enemies in different open cells.
  const candidates=[];
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++){
    if(map[y][x]===0 && !(x===1&&y===1) &&
       !(x===exitCell.x&&y===exitCell.y) &&
       Math.abs(x-1)+Math.abs(y-1)>4){
      candidates.push({x:x+.5,y:y+.5,alive:true});
    }
  }

  // Shuffle candidates so each maze gets different enemy locations.
  for(let i=candidates.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]]=[candidates[j],candidates[i]];
  }
  enemies=[];
  for(const c of candidates){
    if(enemies.length>=5) break;
    // Keep enemies separated from each other.
    if(enemies.every(e=>Math.hypot(e.x-c.x,e.y-c.y)>=2.0))
      enemies.push(c);
  }
  // Fallback if the maze is unusually constrained.
  for(const c of candidates){
    if(enemies.length>=5) break;
    if(!enemies.includes(c)) enemies.push(c);
  }
}

function wall(x,y){
  const mx=Math.floor(x),my=Math.floor(y);
  if(mx<0||my<0||mx>=COLS||my>=ROWS)return true;
  return map[my][mx]===1;
}



function castRay(angle){
  const sin=Math.sin(angle),cos=Math.cos(angle);
  let mapX=Math.floor(player.x),mapY=Math.floor(player.y);

  const deltaX=Math.abs(1/cos);
  const deltaY=Math.abs(1/sin);
  let stepX,stepY,sideX,sideY;

  if(cos<0){stepX=-1;sideX=(player.x-mapX)*deltaX}
  else{stepX=1;sideX=(mapX+1-player.x)*deltaX}
  if(sin<0){stepY=-1;sideY=(player.y-mapY)*deltaY}
  else{stepY=1;sideY=(mapY+1-player.y)*deltaY}

  let side=0;
  for(let i=0;i<100;i++){
    if(sideX<sideY){sideX+=deltaX*1;mapX+=stepX;side=0}
    else{sideY+=deltaY*1;mapY+=stepY;side=1}
    if(mapX<0||mapY<0||mapX>=COLS||mapY>=ROWS)break;
    if(map[mapY][mapX]===1){
      const dist=side===0?sideX-deltaX:sideY-deltaY;
      return {dist:Math.max(.001,dist),side};
    }
  }
  return {dist:50,side:0};
}

const skyCanvas = document.createElement("canvas");
const skyCtx = skyCanvas.getContext("2d");
let skyReady = false;
skyTexture.onload = () => {
  skyCanvas.width = skyTexture.naturalWidth;
  skyCanvas.height = skyTexture.naturalHeight;
  skyCtx.drawImage(skyTexture, 0, 0);
  skyReady = true;
};

function drawMinimap(){
  if(!showMinimap) return;

  const size=180;
  const pad=14;
  const cell=size/COLS;

  ctx.save();
  ctx.globalAlpha=.94;

  // Background + border
  ctx.fillStyle="rgba(0,0,0,.82)";
  ctx.fillRect(W-size-pad,H-size-pad,size,size);
  ctx.strokeStyle="#ddd";
  ctx.lineWidth=2;
  ctx.strokeRect(W-size-pad,H-size-pad,size,size);

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      ctx.fillStyle=map[y][x]===1 ? "#777" : "#202020";
      ctx.fillRect(
        W-size-pad+x*cell,
        H-size-pad+y*cell,
        Math.ceil(cell),
        Math.ceil(cell)
      );
    }
  }

  // Exit
  ctx.fillStyle="#35e86a";
  ctx.fillRect(
    W-size-pad+exitCell.x*cell+cell*.25,
    H-size-pad+exitCell.y*cell+cell*.25,
    cell*.5,cell*.5
  );

  // Player
  const px=W-size-pad+(player.x)*cell;
  const py=H-size-pad+(player.y)*cell;
  ctx.fillStyle="#4aa3ff";
  ctx.beginPath();
  ctx.arc(px,py,Math.max(3,cell*.3),0,Math.PI*2);
  ctx.fill();

  // Direction line
  ctx.strokeStyle="#4aa3ff";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.lineTo(px+Math.cos(player.angle)*cell*1.5,
             py+Math.sin(player.angle)*cell*1.5);
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.font="bold 12px Arial";
  ctx.textAlign="left";
  ctx.fillText("MINIMAP",W-size-pad+7,H-pad-7);

  ctx.restore();
}




function enemyAt(x,y,ignore=null){
  for(const e of enemies){
    if(e!==ignore && e.alive && Math.hypot(x-e.x,y-e.y)<.42) return e;
  }
  return null;
}

function canOccupy(x,y,r=.20,ignoreEnemy=null){
  const pts=[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]];
  for(const [px,py] of pts) if(wall(px,py)) return false;

  // Do not compare against the player itself; that would block every move.
  if(enemyAt(x,y,ignoreEnemy)) return false;
  return true;
}

function movePlayer(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  if(canOccupy(nx,player.y,.20)) player.x=nx;
  if(canOccupy(player.x,ny,.20)) player.y=ny;
}

function moveEnemy(e,dx,dy){
  if(!e || !e.alive) return;
  const r=.20;

  function valid(x,y){
    const pts=[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]];
    for(const [px,py] of pts) if(wall(px,py)) return false;
    if(Math.hypot(x-player.x,y-player.y)<.40) return false;
    if(enemyAt(x,y,e)) return false;
    return true;
  }

  const nx=e.x+dx, ny=e.y+dy;
  if(valid(nx,ny)){
    e.x=nx; e.y=ny; return;
  }
  // Slide along walls/other enemies instead of phasing through them.
  if(valid(nx,e.y)) e.x=nx;
  if(valid(e.x,ny)) e.y=ny;
}

function hasLineOfSight(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  const dist=Math.hypot(dx,dy);
  const steps=Math.ceil(dist*8);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(wall(ax+dx*t,ay+dy*t)) return false;
  }
  return true;
}

function shoot(){
  if(dead || won) return;
  shootFlash=.12;

  let target=null, bestDist=Infinity;
  for(const e of enemies){
    if(!e.alive) continue;
    const dx=e.x-player.x,dy=e.y-player.y;
    const dist=Math.hypot(dx,dy);
    if(dist>12 || !hasLineOfSight(player.x,player.y,e.x,e.y)) continue;

    let angle=Math.atan2(dy,dx)-player.angle;
    while(angle>Math.PI) angle-=Math.PI*2;
    while(angle<-Math.PI) angle+=Math.PI*2;

    if(Math.abs(angle)<.075 && dist<bestDist){
      bestDist=dist;
      target=e;
    }
  }
  if(target) target.alive=false;
}

function updateEnemies(dt){
  if(dead || won) return;

  for(const e of enemies){
    if(!e.alive) continue;
    const dx=player.x-e.x,dy=player.y-e.y;
    const dist=Math.hypot(dx,dy);

    // They only chase when they can actually see the player.
    if(dist>.48 && dist<12 && hasLineOfSight(e.x,e.y,player.x,player.y)){
      const speed=1.35*dt;
      moveEnemy(e,(dx/dist)*speed,(dy/dist)*speed);
    }

    if(Math.hypot(e.x-player.x,e.y-player.y)<.48){
      dead=true;
      break;
    }
  }
}

const gunCanvas=document.createElement("canvas");
const gunCtx=gunCanvas.getContext("2d");
let gunReady=false;
gunTexture.onload=()=>{
  gunCanvas.width=gunTexture.naturalWidth;
  gunCanvas.height=gunTexture.naturalHeight;
  gunCtx.drawImage(gunTexture,0,0);
  const data=gunCtx.getImageData(0,0,gunCanvas.width,gunCanvas.height);
  for(let i=0;i<data.data.length;i+=4){
    const r=data.data[i],g=data.data[i+1],b=data.data[i+2];
    // Treat white and near-white background as transparent.
    const min=Math.min(r,g,b), max=Math.max(r,g,b);
    if(min>232 && max-min<22) data.data[i+3]=0;
    else if(min>210 && max-min<28) data.data[i+3]=Math.max(0,(232-min)*12);
  }
  gunCtx.putImageData(data,0,0);
  gunReady=true;
};

function render(){
  // Sky: render the embedded JPEG with only 1–2 draw calls per frame.
  // The previous version drew hundreds of thousands of individual pixels,
  // which caused the lag spike.
  if(skyReady){
    const skyH=H/2;
    const skyW=Math.max(W*2, skyCanvas.width);
    const offset=((player.angle/(Math.PI*2))*skyW)%skyW;
    const srcW=skyCanvas.width;
    const srcH=skyCanvas.height;

    // Use a temporary panorama canvas, created once, so the texture can wrap.
    if(!window.skyPanorama){
      window.skyPanorama=document.createElement("canvas");
      window.skyPanorama.width=skyW;
      window.skyPanorama.height=skyH;
      const pctx=window.skyPanorama.getContext("2d");
      pctx.drawImage(skyCanvas,0,0,srcW,srcH,0,0,skyW,skyH);
      pctx.drawImage(skyCanvas,0,0,srcW,srcH,skyW,0,skyW,skyH);
    }

    const pan=window.skyPanorama;
    const start=Math.floor(offset);

    if(start+W<=pan.width){
      ctx.drawImage(pan,start,0,W,skyH,0,0,W,skyH);
    }else{
      const first=pan.width-start;
      ctx.drawImage(pan,start,0,first,skyH,0,0,first,skyH);
      ctx.drawImage(pan,0,0,W-first,skyH,first,0,W-first,skyH);
    }
  }else{
    ctx.fillStyle="#4b91d9";
    ctx.fillRect(0,0,W,H/2);
  }

  // Floor
  ctx.fillStyle="#242424";
  ctx.fillRect(0,H/2,W,H/2);

  const fov=Math.PI/3;
  for(let x=0;x<W;x+=2){
    const rayAngle=player.angle-fov/2+(x/W)*fov;
    const hit=castRay(rayAngle);
    // Correct fisheye distortion
    const dist=hit.dist*Math.cos(rayAngle-player.angle);
    const wallH=Math.min(H*2,H/(dist*.72));
    const top=(H-wallH)/2;

    // Draw the embedded brick texture as a vertical raycast slice.
    if(textureReady){
      let wallX;
      if(hit.side===0)
        wallX=player.y + hit.dist*Math.sin(rayAngle);
      else
        wallX=player.x + hit.dist*Math.cos(rayAngle);
      wallX -= Math.floor(wallX);

      let texX=Math.floor(wallX*textureCanvas.width);
      texX=Math.max(0,Math.min(textureCanvas.width-1,texX));

      // Copy a 1-pixel-wide column from the cached texture canvas.
      ctx.drawImage(
        textureCanvas,
        texX,0,1,textureCanvas.height,
        x,top,2,wallH
      );

      // Distance/side shading, while keeping the brick texture visible.
      const darkness=Math.min(0.72,Math.max(0.08,dist/18));
      ctx.fillStyle=`rgba(0,0,0,${darkness})`;
      ctx.fillRect(x,top,2,wallH);

      if(hit.side){
        ctx.fillStyle="rgba(0,0,0,0.10)";
        ctx.fillRect(x,top,1,wallH);
      }
    }else{
      // Fallback while the embedded JPEG is loading.
      ctx.fillStyle="#a94b3b";
      ctx.fillRect(x,top,2,wallH);
    }
  }


  // Render all visible enemies as simple billboards for now.
  const enemyFov=Math.PI/3;
  for(const e of enemies){
    if(!e.alive) continue;
    const dx=e.x-player.x,dy=e.y-player.y;
    const enemyDist=Math.hypot(dx,dy);
    let enemyAngle=Math.atan2(dy,dx)-player.angle;
    while(enemyAngle>Math.PI) enemyAngle-=Math.PI*2;
    while(enemyAngle<-Math.PI) enemyAngle+=Math.PI*2;

    if(Math.abs(enemyAngle)<enemyFov/2 &&
       hasLineOfSight(player.x,player.y,e.x,e.y)){
      const corrected=enemyDist*Math.cos(enemyAngle);
      const eh=Math.min(H*1.3,H/(Math.max(.2,corrected)*.72));
      const ew=eh*.42;
      const ex=W/2+(enemyAngle/(enemyFov/2))*(W/2)-ew/2;
      const ey=H/2-eh*.5;

      ctx.fillStyle="#b52b2b";
      ctx.fillRect(ex,ey,ew,eh);
      ctx.fillStyle="#191919";
      ctx.fillRect(ex+ew*.22,ey+eh*.18,ew*.18,ew*.18);
      ctx.fillRect(ex+ew*.60,ey+eh*.18,ew*.18,ew*.18);
    }
  }

  // Tiny crosshair
  ctx.strokeStyle="rgba(255,255,255,.7)";
  ctx.beginPath();
  ctx.moveTo(W/2-7,H/2);ctx.lineTo(W/2+7,H/2);
  ctx.moveTo(W/2,H/2-7);ctx.lineTo(W/2,H/2+7);
  ctx.stroke();

  // Exit indicator: shows a small marker only if the exit is roughly in front.
  const ex=exitCell.x+.5-player.x,ey=exitCell.y+.5-player.y;
  let a=Math.atan2(ey,ex)-player.angle;
  while(a>Math.PI)a-=2*Math.PI;
  while(a<-Math.PI)a+=2*Math.PI;
  if(Math.abs(a)<fov/2){
    const sx=W/2+(a/(fov/2))*(W/2)*.8;
    ctx.fillStyle="#35e86a";
    ctx.beginPath();
    ctx.arc(sx,35,7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillText("EXIT",sx,57);
  }


  // Embedded gun texture with lightweight recoil + muzzle flash.
  ctx.save();

  const recoil=gunRecoil;
  const gunW=300, gunH=161;
  const gunX=W-305 + recoil*7;
  const gunY=H-160 + recoil*18;

  if(gunReady){
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(gunCanvas,gunX,gunY,gunW,gunH);
  }else{
    ctx.fillStyle="#171717";
    ctx.fillRect(gunX+70,gunY+60,180,45);
  }

  // Short muzzle flash: simple vector shapes, no image processing.
  if(shootFlash>0){
    const p=shootFlash/.10;
    ctx.globalAlpha=p;
    ctx.fillStyle="#fff6b0";
    ctx.beginPath();
    ctx.moveTo(gunX+278,gunY+55);
    ctx.lineTo(gunX+315,gunY+38);
    ctx.lineTo(gunX+294,gunY+61);
    ctx.lineTo(gunX+320,gunY+74);
    ctx.lineTo(gunX+278,gunY+68);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#ff9b20";
    ctx.beginPath();
    ctx.arc(gunX+280,gunY+61,8+5*(1-p),0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  if(dead){
    ctx.fillStyle="rgba(130,0,0,.48)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText("YOU DIED",W/2,H/2-10);
    ctx.font="18px Arial";
    ctx.fillText("Press R to generate a new maze",W/2,H/2+28);
  }

  drawMinimap();
  requestAnimationFrame(render);
}



document.addEventListener("keydown",e=>{
  if(e.key==="Control"){
    e.preventDefault();
    if(!e.repeat) shoot();
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Tab"){
    e.preventDefault();
    showMinimap=!showMinimap;
  }
});

const keys={};
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(k==="r"){
    makeMaze();
    e.preventDefault();
    return;
  }

  if(["arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
    keys[k]=true;
    e.preventDefault();
  }
});
document.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  keys[k]=false;
});

let last=performance.now();
function update(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;

  shootFlash=Math.max(0,shootFlash-dt);
  gunRecoil=Math.max(0,gunRecoil-dt*10);
  updateEnemies(dt);

  if(!won && !dead){
    const speed=3.0*dt;
    const turn=2.5*dt;

    // Alt + left/right = strafing
    // Browser key state doesn't expose Alt reliably through the map,
    // so track the physical Alt key separately.
    if(altDown && keys.arrowleft){
      movePlayer(-Math.cos(player.angle)*speed,Math.sin(player.angle)*speed);
    }else if(altDown && keys.arrowright){
      movePlayer(Math.cos(player.angle)*speed,-Math.sin(player.angle)*speed);
    }else{
      if(keys.arrowup)movePlayer(Math.cos(player.angle)*speed,Math.sin(player.angle)*speed);
      if(keys.arrowdown)movePlayer(-Math.cos(player.angle)*speed,-Math.sin(player.angle)*speed);
      if(keys.arrowleft)player.angle-=turn;
      if(keys.arrowright)player.angle+=turn;
    }

  }
  requestAnimationFrame(update);
}

let altDown=false;
document.addEventListener("keydown",e=>{
  if(e.key==="Alt"){altDown=true;e.preventDefault();}
});
document.addEventListener("keyup",e=>{
  if(e.key==="Alt")altDown=false;
});

makeMaze();
requestAnimationFrame(render);
requestAnimationFrame(update);
</script>
</body>
</html>
